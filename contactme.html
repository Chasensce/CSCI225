<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Chasen Scearce</title>

    <link rel="stylesheet" href="style.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            background-color: #0b5ed7; /* Match blue backdrop from lecture slide */
            padding-top: 70px;
        }
        .custom-navbar {
            background-color: #031b4e !important; /* Dark navy navbar */
        }
        .form-card {
            background-color: #3882c7; /* Form container light blue backdrop */
            border: 2px solid #5ba2e6;
        }
        .video-card {
            background-color: #2a6fb2; /* Video frame backdrop */
            border: 3px solid #5ba2e6;
        }
    </style>
</head>

<body>

    <!-- Fixed Top Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top shadow">
            <div class="container-fluid px-4">
                <div class="navbar-nav fw-semibold gap-3">
                    <a class="nav-link text-white active" href="https://www.usca.edu/" target="_blank">USC Aiken</a>
                    <a class="nav-link text-white" href="index.html">Assignments</a>
                    <a class="nav-link text-white fw-bold" href="index.html">Contact Information</a>
                    <a class="nav-link text-white" href="https://github.com/Chasensce/CSCI225" target="_blank" rel="noopener noreferrer">My GitHub</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Grid -->
    <main class="container my-4">
        <div class="row g-4 align-items-start">

            <!-- Video Column (Left) -->
            <section class="col-lg-5">
                <div class="video-card p-3 rounded-2 shadow">
                    <iframe width="412" height="315" src="https://www.youtube.com/embed/AR6HvfUp95I?si=PKGfincBsD_Y6ScL" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </section>

            <!-- Feedback Form Column (Right) -->
            <section class="col-lg-7">
                <div class="form-card p-4 rounded-2 shadow text-white">

                    <form name="feedback" action="#" method="post">

                        <!-- First Name (Floating Label) -->
                        <div class="form-floating mb-3 text-dark">
                            <input type="text"
                                   class="form-control"
                                   id="fname"
                                   name="fname"
                                   placeholder="First Name*:"
                                   required>
                            <label for="fname">First Name*:</label>
                        </div>

                        <!-- Last Name (Floating Label) -->
                        <div class="form-floating mb-3 text-dark">
                            <input type="text"
                                   class="form-control"
                                   id="lname"
                                   name="lname"
                                   placeholder="Last Name*:"
                                   required>
                            <label for="lname">Last Name*:</label>
                        </div>

                        <!-- Email Address (Floating Label + Required Help Text) -->
                        <div class="form-floating text-dark mb-1">
                            <input type="email"
                                   class="form-control"
                                   id="mail"
                                   name="mail"
                                   placeholder="Email Address:"
                                   required>
                            <label for="mail">Email Address:</label>
                        </div>
                        <small class="form-text text-light d-block mb-3 fs-6">Your email will not be shared with anyone else.</small>

                        <!-- 2. GITHUB FORM INPUT FIELD -->
                        <div class="form-floating mb-3 text-dark">
                            <input type="url"
                                   class="form-control"
                                   id="github"
                                   name="github"
                                   placeholder="GitHub Profile Link:"
                                   pattern="https://.*">
                            <label for="github">GitHub Profile Link (https://...):</label>
                        </div>

                        <!-- Radio Recommendation -->
                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">Would you recommend this website to others?</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           id="yes"
                                           name="recommend"
                                           value="yes"
                                           required>
                                    <label class="form-check-label fw-semibold" for="yes">Yes</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           id="no"
                                           name="recommend"
                                           value="no">
                                    <label class="form-check-label fw-semibold" for="no">No</label>
                                </div>
                            </div>
                        </div>

                        <!-- Preferred Site Select Dropdown -->
                        <div class="mb-3">
                            <label for="reason" class="form-label fw-bold mb-1">Preferred Site:</label>
                            <select class="form-select w-50" id="reason" name="reason">
                                <option value="Google" selected>Google</option>
                                <option value="Facebook">Facebook</option>
                                <option value="Twitter">Twitter</option>
                                <option value="YouTube">YouTube</option>
                            </select>
                        </div>

                        <!-- Rating Range Slider -->
                        <div class="mb-3">
                            <label for="rating" class="form-label fw-bold mb-1">How would you rate this site?</label>
                            <input type="range"
                                   class="form-range"
                                   id="rating"
                                   name="rating"
                                   min="1"
                                   max="10"
                                   value="5">
                        </div>

                        <!-- Additional Comments Textarea -->
                        <div class="mb-3">
                            <label for="comment" class="form-label fw-bold mb-1">Additional Comments:</label>
                            <textarea class="form-control"
                                      id="comment"
                                      name="comment"
                                      rows="5"
                                      placeholder="I suggest..."></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Submit</button>

                    </form>
                </div>
            </section>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
