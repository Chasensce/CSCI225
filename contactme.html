<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Me - Chasen Scearce</title>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="ContactMe.html">Contact Me</a></li>
                <li><a href="https://www.usca.edu/">USC Aiken</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact Me</h1>

        <section>
    <h2>Video</h2>

    <p>
        Here is a video:
    </p>

    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/Dd7FixvoKBw"
        title="Substitute Teacher - Key & Peele"
        allowfullscreen>
    </iframe>

</section>


        <section>

            <h2>Feedback Form</h2>

            <form name="feedback" action="#" method="post">

                <label for="fname">First Name:</label>
                <input type="text"
                       id="fname"
                       name="fname"
                       placeholder="anonymous"
                       required>

                <br><br>


                <label for="lname">Last Name:</label>
                <input type="text"
                       id="lname"
                       name="lname"
                       placeholder="anonymous"
                       required>

                <br><br>


                <label for="mail">Email:</label>
                <input type="email"
                       id="mail"
                       name="mail"
                       placeholder="name@domain.com"
                       required>

                <br><br>


                <label for="phone">Phone Number:</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="123-456-7890">

                <br><br>


                <p>Would you recommend this website?</p>

                <input type="radio"
                       id="yes"
                       name="recommend"
                       value="yes"
                       required>

                <label for="yes">Yes</label>

                <input type="radio"
                       id="no"
                       name="recommend"
                       value="no">

                <label for="no">No</label>

                <br><br>


                <p>Select your favorite websites:</p>

                <input type="checkbox"
                       id="google"
                       name="favoriteWebsite"
                       value="Google">

                <label for="google">Google</label>

                <br>

                <input type="checkbox"
                       id="facebook"
                       name="favoriteWebsite"
                       value="Facebook">

                <label for="facebook">Facebook</label>

                <br>

                <input type="checkbox"
                       id="twitter"
                       name="favoriteWebsite"
                       value="Twitter">

                <label for="twitter">Twitter</label>

                <br>

                <input type="checkbox"
                       id="youtube"
                       name="favoriteWebsite"
                       value="YouTube">

                <label for="youtube">YouTube</label>

                <br><br>


                <label for="rating">
    Rate this website from 1 to 10:
</label>

<input type="number"
       id="rating"
       name="rating"
       min="1"
       max="10"
       required>

                <br><br>

                <label for="reason">Reason for contacting me:</label>

                <select id="reason" name="reason">
                    <option value="feedback">Website Feedback</option>
                    <option value="question">Question</option>
                    <option value="school">School</option>
                    <option value="other">Other</option>
                </select>

                <br><br>


                <label for="date">Date:</label>

                <input type="date"
                       id="date"
                       name="date">

                <br><br>


                <label for="comment">
                    Additional Comments:
                </label>

                <br>

                <textarea id="comment"
                          name="comment"
                          rows="6"
                          cols="50"
                          placeholder="Enter your comments here..."></textarea>

                <br><br>


                <input type="submit"
                       id="submit"
                       name="submit"
                       value="Submit Feedback">

            </form>

        </section>

    </main>


    <footer>

        <p>
            <a href="index.html">Return to Home Page</a>
        </p>

        <p>&copy; 2026 Chasen Scearce</p>

    </footer>

</body>

</html>
